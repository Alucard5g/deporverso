# =========================================================
# CLOUDBUILD.YAML - DESPLIEGUE DIRECTO GITHUB -> CLOUD RUN
# =========================================================
steps:
  # 1. Construir la imagen Docker usando la caché de la imagen anterior para velocidad
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/deporverso:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/deporverso:latest'
      - '--cache-from'
      - 'gcr.io/$PROJECT_ID/deporverso:latest'
      - '.'

  # 2. Subir imagen a Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/deporverso:$COMMIT_SHA'

  # 3. Desplegar contenedor en Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'deporverso'
      - '--image'
      - 'gcr.io/$PROJECT_ID/deporverso:$COMMIT_SHA'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '3000'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--set-env-vars'
      - 'NODE_ENV=production'

images:
  - 'gcr.io/$PROJECT_ID/deporverso:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/deporverso:latest'

options:
  logging: CLOUD_LOGGING_ONLY
