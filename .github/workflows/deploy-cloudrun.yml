name: 🚀 Despliegue Continuo a Google Cloud Run (Deporverso)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GAR_LOCATION: us-central1
  SERVICE_NAME: deporverso
  IMAGE_NAME: deporverso-app

jobs:
  build-and-deploy:
    name: Compilar Docker & Desplegar a Cloud Run
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🔐 Autenticación con Google Cloud (Service Account Key o Workload Identity)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: 🛠️ Configurar Google Cloud SDK (gcloud)
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ secrets.GCP_PROJECT_ID }}

      - name: 🐳 Configurar Docker para Artifact Registry / GCR
        run: |-
          gcloud auth configure-docker ${{ env.GAR_LOCATION }}-docker.pkg.dev --quiet || gcloud auth configure-docker gcr.io --quiet

      - name: 🏗️ Construir y Etiquetar Imagen Docker
        run: |-
          docker build \
            --tag "gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --tag "gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest" \
            .

      - name: 📤 Subir Imagen a Container Registry / Artifact Registry
        run: |-
          docker push "gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker push "gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:latest"

      - name: 🚀 Desplegar a Google Cloud Run
        run: |-
          gcloud run deploy ${{ env.SERVICE_NAME }} \
            --image "gcr.io/${{ secrets.GCP_PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --region ${{ env.GAR_LOCATION }} \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --memory 512Mi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --set-env-vars "NODE_ENV=production,GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" \
            --quiet

      - name: ✅ Verificar URL Pública de Lanzamiento
        run: |-
          SERVICE_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --platform managed --region ${{ env.GAR_LOCATION }} --format 'value(status.url)')
          echo "========================================================="
          echo "🎉 ¡Deporverso desplegado con éxito en Cloud Run!"
          echo "🌐 URL Pública Oficial: $SERVICE_URL"
          echo "========================================================="
